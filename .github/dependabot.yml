# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Strategy: Two-tier approach
# - Tier 1 (auto-merge): Patch and minor updates via dependabot-auto-merge.yml
# - Tier 2 (manual review): Major versions, Docker base images, GitHub Actions

version: 2
# NOTE: version updates are paused. Every ecosystem below sets
# open-pull-requests-limit: 0, which stops Dependabot opening version-update
# PRs (GitHub security alerts/updates are unaffected). Remove those lines to
# resume routine dependency PRs.
updates:
  # GitHub Actions (manual review - infrastructure changes)
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 0 # paused: no version-update PRs while project is dormant
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      github-actions:
        patterns:
          - '*'

  # Go modules (contract tests)
  - package-ecosystem: 'gomod'
    directory: '/'
    open-pull-requests-limit: 0 # paused: no version-update PRs while project is dormant
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'deps(go)'
    labels:
      - 'dependencies'
      - 'go'
    groups:
      go-deps:
        patterns:
          - '*'

  # Go service
