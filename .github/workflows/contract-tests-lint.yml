# Contract Tests Lint
#
# Dedicated linting workflow for the Go contract tests.
# This prevents redundant linting across service workflows.

name: Contract Tests Lint

# Automated CI is paused while the project is dormant (the dedicated GCP
# project has been deleted and deploys are on hold). Run manually from the
# Actions tab when needed; restore the push/pull_request triggers (see git
# history) to re-enable automatic CI.
on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'
          cache-dependency-path: tests/contract/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.8.0
          working-directory: tests/contract
          args: --timeout=5m

      - name: Check go mod tidy
        working-directory: tests/contract
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
