# Contract Tests Lint
#
# Dedicated linting workflow for the Go contract tests.
# This prevents redundant linting across service workflows.

name: Contract Tests Lint

on:
  push:
    branches: [main]
    paths:
      - 'tests/contract/**'
      - '.github/workflows/contract-tests-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/contract/**'
      - '.github/workflows/contract-tests-lint.yml'

jobs:
  lint:
    name: Lint Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'
          cache-dependency-path: tests/contract/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.8.0
          working-directory: tests/contract
          args: --timeout=5m

      - name: Check go mod tidy
        working-directory: tests/contract
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
